<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Saved Wishlist | Tamil Nadu Tourism</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="navbar">
    <div class="container">
      <a href="index.html" class="logo">
        <div class="logo-icon">🛕</div>
        <span>Tamil Nadu <span class="text-gradient">Tourism</span></span>
      </a>

      <nav class="nav-links">
        <a href="index.html" class="nav-link">Home</a>
        <a href="places.html" class="nav-link">Tourist Places</a>
        <a href="categories.html" class="nav-link">Categories</a>
        <a href="trip-planner.html" class="nav-link text-gradient" style="font-weight:700;">✨ Trip Planner</a>
        <a href="hotels.html" class="nav-link">Hotels</a>
        <a href="restaurants.html" class="nav-link">Restaurants</a>
        <a href="emergency.html" class="nav-link text-teal">🚨 Emergency Help</a>
      </nav>

      <div class="nav-actions" id="nav-actions"></div>
      <button class="mobile-menu-btn">☰</button>
    </div>
  </header>

  <main class="main-content">
    <section style="padding: 3rem 0 2rem; background: linear-gradient(to bottom, rgba(239, 68, 68, 0.1), transparent);">
      <div class="container" style="text-align:center;">
        <h1 style="font-size:2.5rem; margin-bottom:0.5rem;">❤️ My Favorites & Saved Destinations</h1>
        <p style="color:var(--text-muted); max-width:600px; margin:0 auto;">
          Your saved wishlist of Tamil Nadu tourist spots for quick trip planning.
        </p>
      </div>
    </section>

    <section class="section" style="padding-top:1rem;">
      <div class="container">
        <div class="places-grid" id="favorites-grid-container">
          <!-- Rendered dynamically -->
        </div>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="container">
      <div class="footer-bottom">
        <div>© 2026 Tamil Nadu Tourism & Smart Trip Planner.</div>
        <div>Personal Wishlist Storage</div>
      </div>
    </div>
  </footer>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      renderFavoritesPage();
      window.addEventListener('favoritesUpdated', renderFavoritesPage);
    });

    function renderFavoritesPage() {
      const container = document.getElementById('favorites-grid-container');
      if (!container || !window.TN_DATA) return;

      const favIds = getFavorites();
      const favPlaces = window.TN_DATA.places.filter(p => favIds.includes(p.id));

      if (favPlaces.length === 0) {
        container.innerHTML = `
          <div style="grid-column: 1 / -1; text-align:center; padding:4rem 1rem;" class="glass-card">
            <span style="font-size:3.5rem; display:block; margin-bottom:1rem;">💔</span>
            <h3>No Favorite Places Saved Yet</h3>
            <p style="color:var(--text-muted); margin:0.5rem 0 1.5rem;">Click the heart icon on any tourist destination card to save it here.</p>
            <a href="places.html" class="btn btn-primary">Browse Tourist Places 🗺️</a>
          </div>
        `;
        return;
      }

      container.innerHTML = favPlaces.map(place => `
        <div class="place-card">
          <div class="place-img-wrap">
            <img src="${place.image}" alt="${place.name}">
            <button class="place-fav-btn fav-btn-${place.id} active" 
                    onclick="toggleFavorite('${place.id}', event)">
              ❤️
            </button>
            <div class="place-rating-badge">★ ${place.rating}</div>
          </div>
          <div class="place-content">
            <div class="place-meta">
              <span class="badge badge-secondary">${place.district}</span>
              <span class="badge badge-primary">${place.categoryName.split(' ')[0]}</span>
            </div>
            <h3 class="place-title">${place.name}</h3>
            <p class="place-desc">${place.shortDesc}</p>
            <div class="place-footer">
              <div style="font-size:0.85rem; color:var(--text-muted);">⏱️ ${place.openTime}</div>
              <a href="place-details.html?id=${place.id}" class="btn btn-primary btn-sm">View Details →</a>
            </div>
          </div>
        </div>
      `).join('');
    }
  </script>
</body>
</html>
