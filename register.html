<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register Account | Tamil Nadu Tourism</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="navbar">
    <div class="container">
      <a href="index.html" class="logo">
        <div class="logo-icon">🛕</div>
        <span>Tamil Nadu <span class="text-gradient">Tourism</span></span>
      </a>
      <div class="nav-actions" id="nav-actions"></div>
    </div>
  </header>

  <main class="main-content auth-page-wrap">
    <div class="auth-card" style="max-width:500px;">
      <div class="auth-header">
        <div class="logo-icon" style="margin: 0 auto 1rem; width:50px; height:50px; font-size:1.6rem;">🛕</div>
        <h2>Create Account</h2>
        <p style="color:var(--text-muted); font-size:0.9rem;">Join Tamil Nadu Tourism to plan custom trips and save favorites</p>
      </div>

      <form id="register-form" onsubmit="handleRegisterSubmit(event)">
        <div class="form-group" style="margin-bottom:1rem;">
          <label for="reg-name">Full Name</label>
          <input type="text" id="reg-name" class="form-input" placeholder="e.g. Anand Sundaram" required>
        </div>

        <div class="form-group" style="margin-bottom:1rem;">
          <label for="reg-email">Email Address</label>
          <input type="email" id="reg-email" class="form-input" placeholder="e.g. anand@example.com" required>
        </div>

        <div class="form-group" style="margin-bottom:1rem;">
          <label for="reg-mobile">Mobile Number</label>
          <input type="tel" id="reg-mobile" class="form-input" placeholder="e.g. +91 98765 43210" pattern="[0-9+ ]{10,14}" required>
        </div>

        <div class="form-group" style="margin-bottom:1rem;">
          <label for="reg-password">Password</label>
          <input type="password" id="reg-password" class="form-input" placeholder="At least 6 characters" minlength="6" required>
        </div>

        <div class="form-group" style="margin-bottom:1.5rem;">
          <label for="reg-confirm-password">Confirm Password</label>
          <input type="password" id="reg-confirm-password" class="form-input" placeholder="Repeat password" required>
        </div>

        <button type="submit" class="btn btn-primary" style="width:100%; padding:0.85rem;">Create Account</button>
      </form>

      <div class="auth-footer">
        Already have an account? <a href="login.html">Login Here</a>
      </div>
    </div>
  </main>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script>
    function handleRegisterSubmit(event) {
      event.preventDefault();

      const name = document.getElementById('reg-name').value.trim();
      const email = document.getElementById('reg-email').value.trim();
      const mobile = document.getElementById('reg-mobile').value.trim();
      const password = document.getElementById('reg-password').value;
      const confirmPassword = document.getElementById('reg-confirm-password').value;

      if (password !== confirmPassword) {
        showToast('Passwords do not match! Please re-check.', 'danger');
        return;
      }

      // Save to registered users array in localStorage
      const usersStr = localStorage.getItem('tn_registered_users');
      const users = usersStr ? JSON.parse(usersStr) : [];
      
      const existing = users.find(u => u.email.toLowerCase() === email.toLowerCase());
      if (existing) {
        showToast('An account with this email already exists!', 'danger');
        return;
      }

      const newUser = { name, email, mobile, password };
      users.push(newUser);
      localStorage.setItem('tn_registered_users', JSON.stringify(users));

      // Auto login user
      localStorage.setItem('tn_user', JSON.stringify({ name, email, mobile }));

      showToast('Account created successfully! Redirecting...', 'success');
      setTimeout(() => {
        window.location.href = 'index.html';
      }, 1000);
    }
  </script>
</body>
</html>
